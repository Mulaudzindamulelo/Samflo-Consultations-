<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samflo Bookkeeping System</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0a0e27, #1a1f3a);
      color: white;
      padding: 20px;
    }
    h1 { color: #a78bfa; }
    .container { max-width: 1000px; margin: auto; }
    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    input, button {
      padding: 10px;
      margin: 5px;
      border-radius: 5px;
      border: none;
    }
    input { width: 200px; }
    button {
      background: #a78bfa;
      color: white;
      cursor: pointer;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid #334155;
      text-align: left;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Samflo Bookkeeping System</h1>  <div class="card">
    <h2>Add Transaction</h2>
    <input type="text" id="desc" placeholder="Description">
    <input type="number" id="amount" placeholder="Amount">
    <select id="type">
      <option value="income">Income</option>
      <option value="expense">Expense</option>
    </select>
    <button onclick="addTransaction()">Add</button>
  </div>  <div class="card">
    <h2>Summary</h2>
    <p>Total Income: R<span id="income">0</span></p>
    <p>Total Expenses: R<span id="expenses">0</span></p>
    <p>Balance: R<span id="balance">0</span></p>
  </div>  <div class="card">
    <h2>Transactions</h2>
    <table>
      <thead>
        <tr>
          <th>Description</th>
          <th>Amount</th>
          <th>Type</th>
        </tr>
      </thead>
      <tbody id="list"></tbody>
    </table>
  </div>
</div><script>
  let transactions = JSON.parse(localStorage.getItem('transactions')) || [];

  function save() {
    localStorage.setItem('transactions', JSON.stringify(transactions));
  }

  function addTransaction() {
    const desc = document.getElementById('desc').value;
    const amount = parseFloat(document.getElementById('amount').value);
    const type = document.getElementById('type').value;

    if (!desc || !amount) return alert('Fill all fields');

    transactions.push({ desc, amount, type });
    save();
    render();
  }

  function render() {
    const list = document.getElementById('list');
    list.innerHTML = '';

    let income = 0, expenses = 0;

    transactions.forEach(t => {
      const row = `<tr>
        <td>${t.desc}</td>
        <td>R${t.amount}</td>
        <td>${t.type}</td>
      </tr>`;
      list.innerHTML += row;

      if (t.type === 'income') income += t.amount;
      else expenses += t.amount;
    });

    document.getElementById('income').innerText = income;
    document.getElementById('expenses').innerText = expenses;
    document.getElementById('balance').innerText = income - expenses;
  }

  render();
</script></body>
</html>
